# ez-local-gif — production-ish compose file (LAN only: no auth, no TLS).
#
#   docker compose up -d --build        # build + run, then open http://localhost:8080
#   docker compose logs -f app
#   docker compose down                 # keeps the ezlg-data volume; add -v to wipe it
#                                       # (-v also wipes ezlg-models: the AI weights)
#
# AI background removal (Phase 5b/5c) is OFF unless you start the matte sidecar —
# ONE of the two profiles (never both: they share the "matte" network alias):
#   docker compose --profile matte up -d        # CPU sidecar  (duckautomata/ezlg-matte:<tag>)
#   docker compose --profile matte-gpu up -d    # CUDA sidecar (…:<tag>-cuda; needs
#                                               # nvidia-container-toolkit + host driver ≥ 580);
#                                               # it offers GPU AND CPU — the user picks "Run on"
#                                               # in the Background card (Phase 5c)
#   # Nothing stays loaded (5c): every model is self-tested at start and released; a pass
#   # loads what it needs and the sidecar drops it again after MATTE_MODEL_TTL idle or when
#   # the user leaves the AI mode. Nothing runs until "Compute matte" or Render is pressed.
#   # or once, in .env (see .env.example): COMPOSE_PROFILES=matte-gpu → plain `up -d` includes it
#   docker compose pull matte-gpu && docker compose up -d   # update the sidecar (pull-only here;
#                                               # the build: blocks live in compose.dev.yaml)
#   docker compose run --rm matte download      # pre-fetch EVERY model of sidecar/models.json (air-gapped: copy the
#                                               # volume; it serves matte and matte-gpu alike; name ids to narrow it)
#
# Dev loop (bind-mounted source, go run + vite dev inside the container):
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# See docs/USAGE.md for WSL2 notes and docs/DESIGN.md §2.1 / §6 / §9.9 for sizing.

# Shared base of the two matte sidecar variants (docs/background-removal-proposal.md §8).
# YAML `<<` merges top-level keys only, so each service restates its full `environment`.
x-matte: &matte
  # The tag this release ships; pinned, never latest. It exists on Docker Hub only
  # once the release is tagged: .github/workflows/docker-image.yml publishes
  # :<tag> / :<tag>-cuda on a `v*` tag push (a plain master push publishes
  # `latest` and the short SHA only) — the release procedure is `git tag -a v0.5.0
  # && git push origin v0.5.0`, then `docker manifest inspect
  # duckautomata/ezlg-matte:v0.5.0-cuda` to verify. Until then, or to run a
  # master build, set EZLG_MATTE_TAG=<short sha> in .env (docs/USAGE.md).
  image: duckautomata/ezlg-matte:${EZLG_MATTE_TAG:-v0.5.0}
  pull_policy: missing
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes: [ezlg-models:/models]              # weights + derived graphs + CUDA JIT cache; survives upgrades
  networks: { default: { aliases: [matte] } } # the app talks to http://matte:9402 whichever variant runs
  healthcheck:
    # python:3.12-slim ships no curl; /v1/ping answers 503 while the device is unavailable (no CUDA EP).
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9402/v1/ping',timeout=3).status==200 else 1)"]
    interval: 30s
    timeout: 5s
    # A cold first start of the cuda image listens only after the CUDA session
    # exists (context + PTX JIT; /models/.nv caches it from then on) and the
    # offered weights (~560 MB with the guided model) are down and self-tested
    # on each device (then released — Phase 5c keeps nothing resident):
    # "health: starting" for minutes is normal then, "unhealthy" is not
    # (docs/USAGE.md Troubleshooting).
    start_period: 300s
  # NO ports: — no auth; never publish it on the LAN. The app reaches it on the compose network only.

services:
  app:
    build:
      context: .
      target: runtime
      # args:
      #   VERSION: v0.1.0            # baked into `ezlg version` and /api/capabilities
    image: ezlg:local
    container_name: ezlg
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Blobs, results and scratch fallback. Keep this on the Linux/WSL ext4
      # filesystem (a named volume does), never under /mnt/c on WSL2 (slow 9P).
      - ezlg-data:/data
      # "Save to /output" target (Phase 4; also where the Discord test kit
      # writes). Bind to any host folder you like — the save button appears only
      # when the folder is writable at startup (features.outputSave). The
      # container runs as uid 1000, so on Linux / inside a WSL distro create the
      # folder BEFORE the first `up` — a bind the Docker daemon auto-creates is
      # root:root 0755 and the app cannot write to it:
      #     mkdir -p output && sudo chown 1000:1000 output
      # (an existing root-owned one:  docker compose run --rm --user root --entrypoint chown app -R 1000:1000 /output).
      # Docker Desktop on Windows/macOS needs neither (binds appear world-writable).
      - ./output:/output
      # Optional read-only source folder for the in-app /input picker (Phase 4;
      # skips the upload — the picker appears when the folder is mounted, and
      # files you add later show up without a restart). Examples:
      # - ./input:/input:ro
      # - /mnt/c/Users/you/Videos/Resolve Exports:/input:ro   # WSL2 → Windows folder
      # - C:/Users/you/Videos/Resolve Exports:/input:ro       # Docker Desktop on Windows
      # Optional extra fonts for the text overlay (Phase 3). DejaVu and Noto
      # Sans/Serif (Latin, Greek, Cyrillic, …) are bundled; drop any .ttf/.otf
      # into a host folder and bind it read-only at /fonts — fontconfig scans
      # that path (Dockerfile: 99-ezlg-fonts-mount.conf). The font list is
      # read once at startup, so `docker compose restart app` after adding
      # files; for a large collection pre-build fontconfig's cache first so
      # the first render is not slow:
      #     docker compose exec app fc-cache -f      # (or: fc-list : family, to check)
      # Families are referenced by name in the text op ("Noto Serif").
      # - ./fonts:/fonts:ro
      # - C:/Windows/Fonts:/fonts:ro                          # Docker Desktop on Windows (all system fonts)
    # The RGBA frame master lives on /dev/shm (1080p RGBA = 8.3 MB/frame). Docker's
    # default 64 MB is far too small. On WSL2 raise `.wslconfig` [wsl2] memory= too.
    shm_size: "4gb"
    environment:
      # All optional — defaults shown (see cmd/ezlg/main.go and docs/USAGE.md).
      EZLG_TTL_HOURS: "24"             # delete blobs/results older than this (0 = never)
      EZLG_MAX_BYTES: "21474836480"    # cap on /data (20 GiB; 0 = none)
      EZLG_MAX_UPLOAD_MB: "2048"       # max upload size
      # EZLG_CONCURRENCY: "8"          # concurrent renders (default NumCPU/2)
      # EZLG_MAX_MASTER_BYTES: "2147483648"   # cap on one render's RGBA frame master in bytes
      #                                 # (default 2 GiB; the ONLY bound on the reverse/bounce RAM
      #                                 # buffer too — keep it below shm_size AND host RAM, past RAM
      #                                 # you get OOM kills, not refusals; huge values are clamped)
      # EZLG_ADDR: ":8080"             # listen address (also change ports: and the healthcheck)
      # EZLG_INPUT: "/input"           # folder the /input picker lists (bind it read-only above)
      # EZLG_OUTPUT: "/output"         # folder "Save to /output" writes to
      # AI background removal (Phase 5b): where the matte sidecar answers. Probed
      # every 30 s; 3 misses = features.matte off (back on when it answers again);
      # "" disables it. Nothing is reached until a matte profile is up — and there
      # is deliberately no depends_on: the app must start without the sidecar.
      EZLG_MATTE_URL: "http://matte:9402"
      # EZLG_MATTE_MAX_SECONDS: "600"  # refuse a clip whose estimated AI pass exceeds this
      # EZLG_MATTE_MAX_FRAMES: "3000"  # … or that would send more frames than this to the sidecar
      # EZLG_MATTE_DEVICE: ""          # Phase 5c: the device AI passes run on when the sidecar offers
      #                                 # several ("cuda" / "cpu"; "" = the sidecar's default). Only the
      #                                 # STARTUP value: the card's "Run on" select (PUT /api/matte/settings)
      #                                 # changes it at run time and persists it under /data/mattes/settings.json,
      #                                 # which then wins. The device is never part of a recipe or a result.
      # NVIDIA_DRIVER_CAPABILITIES: compute,video,utility   # with the gpu block below
    # -- GPU for the app itself (not used in v1; see docs/DESIGN.md §6). Uncomment for
    #    NVDEC/NVENC later, together with NVIDIA_DRIVER_CAPABILITIES above (needs
    #    nvidia-container-toolkit, host driver >= 610 for the prebuilt FFmpeg 9 NVENC).
    #    AI matting does NOT need this: the matte-gpu service below carries its own reservation.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---- AI matte sidecar (docs/background-removal-proposal.md §7–§8, sidecar/README.md).
  # Start ONE of the two; both answer as http://matte:9402 (the app warns when two
  # instances alternate behind the alias). MATTE_DEVICE is the sidecar's DEFAULT device;
  # the cuda image offers cuda AND cpu (it carries both execution providers) and the
  # user picks "Run on: GPU / CPU" in the Background card (Phase 5c). MATTE_MODELS picks
  # the models the UI offers (ids from sidecar/models.json: isnet-anime = "Anime (fast)",
  # birefnet-lite = "General (precise)", sam2-tiny = "Guided (click to select)" — the
  # SAM 2 tracker behind the box / click prompts); the UI preselects the sidecar's
  # default model FOR THE DEVICE IN USE (General on cuda, Anime on cpu —
  # MATTE_DEFAULT_MODEL_CUDA / _CPU override one, MATTE_DEFAULT_MODEL both) and lets the
  # user choose any offered model per recipe. Nothing stays resident: every offered model
  # is downloaded and self-tested on each offered device at start (so an estimate exists
  # before the first pass) and released at once; a pass loads what it needs, the sidecar
  # drops it after MATTE_MODEL_TTL idle, and the app asks it to drop everything when the
  # user leaves the AI mode (POST /api/matte/unload).
  matte:                                      # docker compose --profile matte up -d        (CPU)
    <<: *matte
    profiles: [matte]
    environment:
      MATTE_DEVICE: cpu
      MATTE_MODELS: isnet-anime,sam2-tiny     # offered models (comma list); birefnet-lite on CPU needs ≥ 14 GiB RAM free;
                                              # the guided tracker runs fp32 on CPU (slow — fine for short clips)
      # MATTE_DEFAULT_MODEL_CPU: isnet-anime  # the model the UI preselects on cpu (MATTE_DEFAULT_MODEL: on every device)
      # MATTE_PRELOAD: ""                     # "" (default) = every offered model is downloaded + self-tested at start,
                                              # then RELEASED; a comma list keeps the named ones resident (dedicated box)
      MATTE_MODEL_TTL: "300"                  # seconds idle before a model is unloaded; 0 = never (dedicated box);
                                              # 120 = hand a shared desktop its RAM back sooner (isnet reloads in ~1 s)
      # MATTE_MAX_TRACK_FRAMES: "3000"        # frames one guided (tracker) request may carry
      HOME: /tmp
      # MATTE_THREADS: "0"                    # ONNX intra-op threads (0 = physical cores; lower it when renders share the cores)
      # MATTE_MODELS_BASE_URL: ""             # mirror for the weights (air-gapped hosts)
    # mem_limit: 16g                          # Precise on CPU needs ~13 GB RSS; the sidecar refuses it below 14 GiB available
  matte-gpu:                                  # docker compose --profile matte-gpu up -d    (CUDA, offers cpu too)
    <<: *matte
    image: duckautomata/ezlg-matte:${EZLG_MATTE_TAG:-v0.5.0}-cuda
    profiles: [matte-gpu]
    environment:
      MATTE_DEVICE: cuda                      # the DEFAULT device; cpu is offered next to it ("Run on" in the card).
                                              # Stays up and reports device "unavailable" when the CUDA EP is missing
      MATTE_MODELS: isnet-anime,birefnet-lite,sam2-tiny   # offered models (comma list), on both devices
      # MATTE_DEFAULT_MODEL_CUDA: birefnet-lite   # the UI's preselection on cuda (General: precise AND stable on video)
      # MATTE_DEFAULT_MODEL_CPU: isnet-anime      # … and on cpu (lite on CPU is gated by the 14 GiB RAM check)
      # MATTE_PRELOAD: ""                     # "" = self-test every model on both devices at start, then release;
                                              # a comma list keeps those resident (e.g. birefnet-lite: 2–20 s to reload)
      MATTE_MODEL_TTL: "300"                  # 0 = never unload; 120 = hand a shared desktop its VRAM back sooner
      MATTE_GPU_MEM_LIMIT_GIB: "6"            # lite's arena cap; lower values fail (§7.3) — raise it on larger cards only
      # MATTE_MAX_TRACK_FRAMES: "3000"        # frames one guided (tracker) request may carry (~1.2 GB VRAM per 45 frames at 720²)
      # MATTE_TRACK_OFFLOAD_FRAMES: "300"     # longer tracks keep SAM 2's memory bank in host RAM (~1.2× slower, no OOM on long clips)
      CUDA_CACHE_PATH: /models/.nv            # the PTX JIT cache survives restarts
      HOME: /tmp
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }

volumes:
  ezlg-data:
  ezlg-models:                                # the sidecar's weights (~560 MB: isnet 176, lite 224, sam2-tiny 156), derived graphs and JIT cache
