name: Docker Image

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: ["master"]
    workflow_dispatch:

jobs:
    # Mirrors the `go` job in test.yml — keep the steps identical in both files.
    go-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: "go.mod"

            - name: Format Check
              run: |
                  unformatted=$(gofmt -l ./cmd ./internal)
                  if [ -n "$unformatted" ]; then
                      echo "gofmt needed on:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            # Tests that need real ffmpeg/gifsicle/... skip themselves when the
            # tool is not on PATH; do NOT install ffmpeg here (ubuntu ships an
            # old major, the code targets FFmpeg 9 — clean skips are correct).
            - name: Run Tests
              run: go test ./...

    # Mirrors the `web` job in test.yml — keep the steps identical in both files.
    web-test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        defaults:
            run:
                working-directory: web

        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22"

            - name: Install Dependencies
              run: npm ci

            - name: Verify Package Signatures
              run: npm audit signatures --min-release-age=0

            - name: Svelte Check
              run: npm run check

            - name: Run Tests
              run: npm test -- --run

            - name: Build Static Files
              run: npm run build

    build-push:
        needs: [go-test, web-test]
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read

        steps:
            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set Version From Commit
              run: echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Build and Push Runtime Image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  target: runtime
                  push: true
                  tags: duckautomata/ez-local-gif:latest
                  build-args: |
                      VERSION=${{ env.VERSION }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
