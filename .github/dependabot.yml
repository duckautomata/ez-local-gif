version: 2
updates:
    - package-ecosystem: "gomod"
      directory: "/"
      schedule:
          interval: "cron"
          cronjob: "0 8 1 * *"
      labels:
          - "dependabot"
      commit-message:
          prefix: "chore"
      open-pull-requests-limit: 10
      cooldown:
          default-days: 7
          semver-major-days: 14
          semver-minor-days: 7
          semver-patch-days: 7
          include:
              - "*"
      groups:
          gomod-all:
              patterns:
                  - "*"
              update-types:
                  - "major"
                  - "minor"
                  - "patch"

    - package-ecosystem: "npm"
      directory: "/web"
      schedule:
          interval: "cron"
          cronjob: "0 8 7 * *"
      labels:
          - "dependabot"
      commit-message:
          prefix: "chore"
      open-pull-requests-limit: 10
      cooldown:
          default-days: 7
          semver-major-days: 14
          semver-minor-days: 7
          semver-patch-days: 7
          include:
              - "*"
      ignore:
          # svelte-check does not yet allow typescript 7 — drop this ignore
          # once svelte-check's peer range includes it.
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
      groups:
          npm-all:
              patterns:
                  - "*"
              update-types:
                  - "major"
                  - "minor"
                  - "patch"

    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: "cron"
          cronjob: "0 8 14 * *"
      labels:
          - "dependabot"
      commit-message:
          prefix: "chore"
      open-pull-requests-limit: 5
      cooldown:
          default-days: 7
          include:
              - "*"
      groups:
          docker-all:
              patterns:
                  - "*"
              update-types:
                  - "major"
                  - "minor"
                  - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "cron"
          cronjob: "0 8 21 * *"
      labels:
          - "dependabot"
      commit-message:
          prefix: "chore"
      open-pull-requests-limit: 5
      cooldown:
          default-days: 7
          include:
              - "*"
      groups:
          actions-all:
              patterns:
                  - "*"
              update-types:
                  - "major"
                  - "minor"
                  - "patch"
